# LiveSky — Android Release Build (Manual & Tag)

name: Android Release Build (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Версия релиза (например v1.4-alpha) — оставьте пустым, чтобы не публиковать в Releases'
        required: false
        default: 'v1.4-alpha'

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK platform + build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm test

      - name: Sync Capacitor
        run: npm run cap:sync

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "BUILD_KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BUILD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "BUILD_KEY_PASS=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias livesky \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass livesky123 -keypass livesky123 \
              -dname "CN=LiveSky Weather Pro, OU=Mobile, O=LiveSky, L=Almetyevsk, S=Tatarstan, C=RU"
            echo "BUILD_KS_PASS=livesky123" >> "$GITHUB_ENV"
            echo "BUILD_KEY_ALIAS=livesky" >> "$GITHUB_ENV"
            echo "BUILD_KEY_PASS=livesky123" >> "$GITHUB_ENV"
          fi

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: app/release.keystore
          KEYSTORE_PASSWORD: ${{ env.BUILD_KS_PASS }}
          KEY_ALIAS: ${{ env.BUILD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.BUILD_KEY_PASS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/LiveSky-1.4-Alpha.apk
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/LiveSky-release.apk
          else
            cp android/app/build/outputs/apk/release/*.apk artifacts/LiveSky-release.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveSky-release-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            artifacts/LiveSky-1.4-Alpha.apk
            artifacts/LiveSky-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
