# LiveSky — Android Release Build (ручной шаблон)
#
# Это ШАБЛОН. Скопируйте его в .github/workflows/android-release-manual.yml,
# настройте секреты в Settings → Secrets and variables → Actions, и можно запускать.
#
# Необходимые секреты (Settings → Secrets → Actions):
#   KEYSTORE_BASE64    — keystore в base64: base64 -w 0 release.jks
#   KEYSTORE_PASSWORD  — пароль от keystore
#   KEY_ALIAS          — alias ключа внутри keystore
#   KEY_PASSWORD       — пароль от ключа (обычно совпадает с KEYSTORE_PASSWORD)
#
# Как запустить: Actions → "Android Release Build (Manual)" → Run workflow

name: Android Release Build (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Версия релиза (например v1.3.1) — оставьте пустым, чтобы не публиковать в Releases'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform + build-tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install npm dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm test

      - name: Sync Capacitor
        run: npm run cap:sync

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/LiveSky-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveSky-release-${{ github.sha }}
          path: artifacts/LiveSky-release.apk
          if-no-files-found: error
          retention-days: 30

      # Публикует APK в GitHub Release только если передан тег
      - name: Publish to GitHub Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: artifacts/LiveSky-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
